<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System uptime</title>
<style>
  html,body{margin:0;height:100%;background:transparent;color:var(--on-surface,var(--text,#e6e8eb));font-family:var(--font,system-ui,sans-serif)}
  *{box-sizing:border-box}
  .wrap{height:100%;padding:12px 18px;display:flex;flex-direction:column;justify-content:center;gap:8px;overflow:hidden}
  .value{font-size:calc(clamp(24px,7vw,36px) * var(--text-scale,1));font-weight:650;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere;color:var(--accent,#d9b36a)}
  .note{font-size:calc(14px * var(--text-scale,1));color:var(--text-muted,#8b93a0);line-height:1.3}
  html.on-light .note{color:var(--on-surface,#15202b);opacity:.75}
  html.accent-fill .value{color:var(--on-surface,#0b0d10)}
  html.accent-fill .note{color:var(--on-surface,#0b0d10);opacity:.75}
</style></head><body><div class="wrap"><div class="value" id="value"></div><div class="note" id="note" role="status"></div></div>
<script>
  var L = {
    loading: { fr: 'Chargement…', en: 'Loading…' },
    unknown: { fr: 'Indisponible', en: 'Unavailable' },
    stale: { fr: 'Données anciennes', en: 'Stale data' },
    since: { fr: 'Depuis le dernier démarrage', en: 'Since the last system boot' },
    day: { fr: 'j', en: 'd' }
  }
  var last = null, received = false, failed = false
  function duration(seconds) {
    var minutes = Math.floor(seconds / 60), days = Math.floor(minutes / 1440)
    var hours = Math.floor(minutes % 1440 / 60), parts = []
    if (days) parts.push(days + ' ' + Fremkit.t(L.day))
    if (hours || days) parts.push(hours + ' h')
    parts.push(minutes % 60 + ' min')
    return parts.join(' ')
  }
  function render() {
    document.documentElement.lang = Fremkit.locale
    var seconds = last && last.uptimeSeconds
    var known = typeof seconds === 'number' && Number.isFinite(seconds) && seconds >= 0
    document.getElementById('value').textContent = known ? duration(seconds) : '?'
    document.getElementById('note').textContent = Fremkit.t(
      !received ? L.loading : failed && known ? L.stale : !known ? L.unknown : L.since
    )
  }
  Fremkit.whenReady(function () {
    Fremkit.subscribe('system', function (data) {
      received = true
      failed = !!(data && data.error)
      if (!failed) last = data
      render()
    })
    Fremkit.onLocale(render)
    render()
  })
</script></body></html>
